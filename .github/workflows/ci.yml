name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core validation and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run core tests
        run: npm test
      - name: Validate bundled examples
        run: npm run validate -- examples/minimal/project-context.json

  react-renderer:
    name: React renderer checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderers/react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check renderer
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
      - name: Run browser, visual and accessibility tests
        run: npm test
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            renderers/react/test-results/
            renderers/react/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
