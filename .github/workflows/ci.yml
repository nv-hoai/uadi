name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core validation and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run core tests
        run: npm test
      - name: Validate minimal project context
        run: npm run validate -- examples/minimal/project-context.json
      - name: Validate component catalog
        run: npm run validate -- component-catalog/catalog.json
      - name: Validate confirmatory study template
        run: npm run study:validate -- benchmarks/study-design.template.json
      - name: Validate preregistered study design
        run: npm run study:validate -- benchmarks/studies/confirmatory-2026-11/study-design.json
      - name: Validate UDS prototype contract
        run: npm run prototype:check -- examples/minimal/design-specification.json
      - name: Run deterministic quality gates on the fixture deliverable
        run: npm run quality:gates -- --dir tests/fixtures/quality-gates/good --no-browser

  react-renderer:
    name: React renderer checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderers/react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check renderer
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
      - name: Run browser, visual and accessibility tests
        run: npm test
      - name: Run deterministic quality gates with the browser on the fixture
        run: node ../scripts/quality-gates.mjs --dir ../tests/fixtures/quality-gates/good
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            renderers/react/test-results/
            renderers/react/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
