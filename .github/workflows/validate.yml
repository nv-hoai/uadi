name: Validate UADI artifacts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run validate -- examples/minimal/project-context.json examples/minimal/discovery-result.json
      - name: Type-check React renderer
        working-directory: renderers/react
        run: npm install && npm run typecheck
