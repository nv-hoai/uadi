<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settings</title></head>
<body>
  <main>
    <h1>Workspace settings</h1>
    <button type="button" aria-label="Save settings">Save settings</button>
    <label for="name">Workspace name</label>
    <input id="name" type="text" placeholder="Harbor Studio">
    <section data-state="default">Loaded settings</section>
    <section data-state="loading">Loading settings</section>
    <section data-state="empty">No projects yet</section>
    <section data-state="error">Settings failed to load</section>
    <section data-state="success">Settings saved</section>
    <section data-state="restricted">Members cannot change billing</section>
  </main>
</body>
</html>
